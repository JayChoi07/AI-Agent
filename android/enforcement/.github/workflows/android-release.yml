name: android-release

# 선택 파일이다. 기본 경로는 scripts/release.sh 로 번들을 만들어 Play Console 에 직접 올리는 것이다 (R-31-18, R-31-10).
# 비공개 저장소에서는 실행 시간이 요금제 포함 분량에서 차감되고, 결제 수단이 있으면 초과분이 청구된다.
# R-31-10: 업로드는 사람이 이 워크플로를 수동 실행했을 때만 돈다. push·schedule 트리거를 넣지 않는다.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: true

      # R-31-08 · R-19-12: 업로드 키와 비밀번호는 시크릿에서만 온다. 키스토어는 base64 로 넣어 둔다.
      # KEYSTORE_PROPERTIES 의 storeFile 은 여기서 만드는 upload.jks 를 가리켜야 하고,
      # :app 에 signingConfigs(R-19-12)가 추가돼 있어야 release 번들이 서명된다.
      - name: keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties

      # R-31-11: versionCode 는 distribution/version-code.txt 에서 읽는다. 실행하기 전에
      # scripts/bump-version-code.sh 로 값을 올려 커밋·푸시해 둔다. 실행 번호는 쓰지 않는다.
      - name: bundle
        run: ./gradlew bundleRelease --no-daemon

      # R-31-12 · R-31-13: tracks 를 생략하면 production 이다. internal 만 쓴다.
      # R-31-15: 릴리스 노트는 distribution/whatsnew/whatsnew-<언어 태그>.
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.app   # 앱의 applicationId 로 바꾼다 (R-19-03)
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
