name: android-instrumented

# 선택 파일이다. 기본 경로는 scripts/instrumented.sh 로 로컬 기기·에뮬레이터에서 돌리는 것이다 (R-31-18).
# 비공개 저장소에서는 실행 시간이 요금제 포함 분량에서 차감되고, 결제 수단이 있으면 초과분이 청구된다.

# R-31-07: 계측 테스트는 PR 필수 게이트가 아니다. 주 2회 예약 실행과 수동 실행으로만 돈다.
# 비공개 저장소는 실행 시간이 요금제의 무료 분량에서 차감된다. 횟수는 팩 선택이고 프로젝트에 맞게 바꾼다.
on:
  schedule:
    - cron: '0 18 * * 0,3'   # 일·수 18:00 UTC (한국 시간 월·목 03:00)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R-31-17: 이번 달 Actions 사용량이 포함 분량의 STOP_AT_PERCENT 이상이면 계측 잡을 건너뛴다.
  # 사용량을 읽지 못해도 건너뛴다. 이 잡도 실행마다 1분 안팎을 쓴다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.usage.outputs.run }}
    steps:
      - id: usage
        env:
          # 조직: "Administration" 조직 권한(read), 개인 계정: "Plan" 사용자 권한(read)의 fine-grained 토큰
          GH_TOKEN: ${{ secrets.BILLING_READ_TOKEN }}
          # 개인 계정 저장소면 users/<계정 이름> 으로 바꾼다
          USAGE_OWNER: organizations/${{ github.repository_owner }}
          # 요금제의 월 포함 분량 (GitHub Free 2000, Pro·Team 3000)
          INCLUDED_MINUTES: 2000
          STOP_AT_PERCENT: 95
        run: |
          run=false
          limit=$(( INCLUDED_MINUTES * STOP_AT_PERCENT / 100 ))
          query='[.usageItems[]? | select((.product | ascii_downcase) == "actions" and (.unitType | ascii_downcase) == "minutes") | .quantity] | add // 0'
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BILLING_READ_TOKEN 이 없어 사용량을 읽지 못했다. 계측 테스트를 건너뛴다."
          elif used=$(gh api "/$USAGE_OWNER/settings/billing/usage?year=$(date -u +%Y)&month=$(date -u +%-m)" --jq "$query"); then
            used=${used%.*}
            echo "이번 달 Actions 사용 ${used}분, 기준 ${limit}분"
            if [ "$used" -lt "$limit" ]; then
              run=true
            else
              echo "::warning::Actions 사용량이 기준(${limit}분)에 닿았다. 계측 테스트를 건너뛴다."
            fi
          else
            echo "::warning::사용량 조회에 실패했다. 계측 테스트를 건너뛴다."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  connected:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        # R-31-16: minSdk(26)와 최근 이미지 하나. 조합은 팩 결정이고 비공개 저장소는 실행 분량이 차감된다.
        api-level: [26, 35]
    steps:
      # R-31-16: 에뮬레이터 스텝보다 먼저 KVM 권한을 준다.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      # R-31-06: 실패해도 리포트를 올린다.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/**'
