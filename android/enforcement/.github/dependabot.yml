# 의존성 자동 업데이트 (R-33-01). 저장소의 .github/dependabot.yml 로 복사한다.
# 자동 병합은 하지 않는다 — PR 게이트(android-ci.yml)를 통과한 PR 을 사람이 병합한다 (R-33-02).
# 주기 weekly 는 출처가 정하지 않은 팩 선택이다. 묶음(groups)은 만들지 않았다 (R-33-03).
version: 2
updates:
  # 라이브러리·플러그인(gradle/libs.versions.toml)과 Gradle 래퍼
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

  # 워크플로의 액션 버전 (R-31-04 메이저 태그 고정이라 메이저가 바뀔 때만 PR 이 열린다)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
